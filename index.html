<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walentynkowa Strona 💘</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(135deg, #ffafbd, #ffc3a0);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Comic Sans MS", sans-serif;
    font-size: large;
  }

  /* Serduszka spadające */
  .heart {
    position: fixed;
    top: -10px;
    color: red;
    font-size: 20px;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh);
      opacity: 0;
    }
  }

  .heart-card {
    background: pink;
    width: 450px;
    height: 405px;
    position: relative;
    transform: rotate(-5deg);
    clip-path: polygon(50% 90%, 100% 40%, 75% 0, 50% 20%, 25% 0, 0 40%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    text-align: center;
    padding: 20px;
  }

  .question {
    font-size: 1.3em;
    color: #d10060;
  }

  .buttons {
    margin-top: 20px;
  }

  button {
    background-color: #ff4d6d;
    color: white;
    border: none;
    padding: 10px 20px;
    margin: 5px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 1em;
    transition: 0.3s;
  }

  button:hover {
    background-color: #ff1e56;
  }

  .response {
    font-size: 1em;
    color: #d10060;
  }

  img {
    width: 150px;
    border-radius: 10px;
  }

  /* Responsywność */
  @media (max-width: 700px) {
    .heart-card {
      width: 270px;
      height: 250px;
    }
    button {
      font-size: 0.9em;
      padding: 8px 15px;
    }
  }
</style>
</head>
<body>

<div class="heart-card" id="card">
  <div class="question">Czy zostaniesz moją Walentynką? 💕</div>
  <div class="buttons">
    <button id="yesBtn">Tak</button>
    <button id="noBtn">Nie</button>
  </div>
</div>

<script>
function createHeart(symbol = '❤️') {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = Math.random() * 3 + 2 + 's';
  heart.innerText = symbol;
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}

// Spadające serca na start
setInterval(() => createHeart(), 300);

const card = document.getElementById('card');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

yesBtn.addEventListener('click', () => {
  card.innerHTML = `
    <div class="response">Jejeeeeej ❤️<br> KOOOOCHAM CIĘ💕</div>
    <img src="gifw.gif" alt="Moja reakcja">
  `;
});

// Opcja NIE — przycisk ucieka i spadają złe emoji
noBtn.addEventListener('click', () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  alert("Nie ma takiej opcji Aleksandro!!!!! 😡")

  // Spadające złe emoji
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
  createHeart('😡');
});
</script>
</body>
</html>
